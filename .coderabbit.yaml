
language: en-US

reviews:
  profile: chill
  auto_review:
    enabled: true
    drafts: false
  path_filters:
    - "!src/Cinema.Infrastructure/Migrations/**"
  path_instructions:
    - path: "src/Modules/**"
      instructions: |
        Review clean architecture boundaries, domain invariants,
        transaction safety, concurrency, cancellation tokens,
        validation and authorization.
        Focus on correctness rather than stylistic preferences.

    - path: "src/Modules/Orders/**"
      instructions: |
        Pay special attention to reservation and payment lifecycle,
        idempotency, compensation, partial failures, Redis locks,
        and consistency between Orders, Tickets and Loyalty.

    - path: "src/Host/Cinema.Api/**"
      instructions: |
        Review endpoint authorization, API contracts, validation,
        SignalR event compatibility and HTTP status handling.
