name: Deploy .NET Backend

on:
  push:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: deploy-backend-main
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Validate trusted deployment configuration
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.HOST }}
          DEPLOY_USER: ${{ secrets.USERNAME }}
          DEPLOY_KEY: ${{ secrets.SSH_KEY }}
          DEPLOY_FINGERPRINT: ${{ secrets.SSH_HOST_FINGERPRINT }}
        run: |
          set -euo pipefail
          if [[ -z "$DEPLOY_HOST" || -z "$DEPLOY_USER" || -z "$DEPLOY_KEY" ]]; then
            echo '::error::Required deployment credentials are missing.'
            exit 1
          fi
          if [[ ! "$DEPLOY_FINGERPRINT" =~ ^SHA256:[A-Za-z0-9+/]{43}$ ]]; then
            echo '::error::SSH_HOST_FINGERPRINT must contain an independently verified SHA256 host fingerprint.'
            exit 1
          fi

      - name: Clean remote backend workspace (remove stale files)
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262 # v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          fingerprint: ${{ secrets.SSH_HOST_FINGERPRINT }}
          script: |
            set -euo pipefail
            echo "Cleaning /root/cinema-platform/backend ..."
            rm -rf /root/cinema-platform/backend
            mkdir -p /root/cinema-platform/backend

      - name: Copy files via SSH (fresh sync)
        uses: appleboy/scp-action@8a92fcdb1eb4ffbf538b2fa286739760aac8a95b # v0.1.4
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          fingerprint: ${{ secrets.SSH_HOST_FINGERPRINT }}
          source: "."
          target: "/root/cinema-platform/backend"

      - name: Build and Restart .NET Container
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262 # v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          fingerprint: ${{ secrets.SSH_HOST_FINGERPRINT }}
          script: |
            set -euo pipefail
            cd /root/cinema-platform
            echo "=========================================="
            echo "[Server] Building & starting cinema-api via docker compose..."
            # Використовуємо --no-cache для білду, якщо хочеш 100% застрахуватись від фантомного кешу
            docker compose build --no-cache cinema-api
            docker compose up -d cinema-api
            echo "[Server] Pruning unused images..."
            docker image prune -f
            echo "=========================================="